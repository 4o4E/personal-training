name: 发布个人训练后端镜像

on:
  push:
    paths:
      - .github/workflows/publish-training-image.yml
      - training-app/Dockerfile
      - training-app/.dockerignore
      - training-app/*.gradle.kts
      - training-app/gradle.properties
      - training-app/gradlew*
      - training-app/gradle/**
      - training-app/shared/**
      - training-app/server/**
      - training-app/catalog/**
  workflow_dispatch:

concurrency:
  group: training-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: 读取源码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 准备镜像构建器
        uses: docker/setup-buildx-action@v4

      - name: 生成实际仓库镜像地址
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=latest

      - name: 构建镜像并执行后端回归
        uses: docker/build-push-action@v7
        with:
          context: ./training-app
          file: ./training-app/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=training-backend
          cache-to: type=gha,mode=max,scope=training-backend

      - name: 检查容器启动与唯一 token 鉴权
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          docker run --detach --name training-image-smoke --publish 127.0.0.1:18080:8080 "$IMAGE"
          trap 'docker rm --force training-image-smoke >/dev/null' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:18080/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/health | jq --exit-status '.status == "ok"'
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/v1/history)"
          test "$status" = 401
          token="$(docker exec training-image-smoke cat /data/token)"
          curl --fail --silent --show-error --header "Authorization: Bearer $token" http://127.0.0.1:18080/v1/history \
            | jq --exit-status '.sessions == [] and .strengthSets == 0 and .stretchSets == 0'

      - name: 检查手动部署配置
        shell: bash
        run: docker compose --file training-app/compose.yml config --quiet

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布已检查的镜像
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: docker push "$IMAGE"

      - name: 写入手动部署参数
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          {
            printf '## 个人训练后端\n\n镜像：`%s`\n\n' "$IMAGE"
            printf '源码仓库保持 Private，GHCR 镜像包为 Public，可匿名拉取。\n\n'
            printf '将仓库中的 `training-app/compose.yml` 复制到固定部署目录，无需复制源码或配置镜像仓库参数。\n\n'
            printf '执行 `docker compose pull` 和 `docker compose up -d`。持久数据保存在命名卷中。\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 验证公开镜像可以匿名拉取
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          configuration="$(mktemp -d)"
          trap 'rm -rf -- "$configuration"' EXIT
          docker --config "$configuration" pull "$IMAGE"
