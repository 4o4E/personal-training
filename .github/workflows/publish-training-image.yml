name: 检查与发布个人训练

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/**'
      - '!data/**'
  pull_request:
    paths:
      - '**'
      - '.github/workflows/**'
      - '!data/**'

permissions:
  contents: read

concurrency:
  group: training-${{ github.ref_type == 'tag' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: 允许执行 Gradle
        run: chmod +x gradlew
      - name: 检查应用、后端与采集器
        if: github.ref_type != 'tag'
        run: ./gradlew :collector:build :shared:test :server:test :android:testDebugUnitTest :android:assembleDebug --no-daemon
      - name: 同版本构建签名 APK 与后端
        if: github.ref_type == 'tag'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/training-signing.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]] || { echo "不支持的正式版本标签" >&2; exit 1; }
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          ./gradlew -PreleaseVersion="${GITHUB_REF_NAME#v}" :collector:build :collector:distZip :shared:test :server:test :android:testDebugUnitTest :server:distZip :android:assembleRelease --no-daemon
          mkdir -p release
          cp "collector/build/distributions/collector-${GITHUB_REF_NAME#v}.zip" "release/personal-training-collector-${GITHUB_REF_NAME#v}.zip"
          node tools/package-release.mjs "${GITHUB_REF_NAME#v}"
      - name: 保存 Release 草稿与配套产物
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.apk release/*.zip release/update.json --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file release/notes.md

  image:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 下载实际 Release 运行包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --pattern 'personal-training-server-*.zip' --dir .release
          gh release download "$GITHUB_REF_NAME" --pattern 'personal-training-collector-*.zip' --dir .release
          unzip -q .release/personal-training-server-*.zip -d .release/unpacked
          node tools/prepare-image.mjs ".release/unpacked/server-${GITHUB_REF_NAME#v}/lib" .release/image
          mkdir -p .release/collector-image
          unzip -q .release/personal-training-collector-*.zip -d .release/collector-image
          mv ".release/collector-image/collector-${GITHUB_REF_NAME#v}" .release/collector-image/app
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
      - id: collector-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-collector
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
      - name: 组装 Release 后端运行镜像
        uses: docker/build-push-action@v7
        with:
          context: .release/image
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=training-runtime
          cache-to: type=gha,mode=max,scope=training-runtime
      - name: 组装 Release 采集器运行镜像
        uses: docker/build-push-action@v7
        with:
          context: .release/collector-image/app
          file: Collector.Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.collector-meta.outputs.tags }}
          labels: ${{ steps.collector-meta.outputs.labels }}
          cache-from: type=gha,scope=collector-runtime
          cache-to: type=gha,mode=max,scope=collector-runtime
      - name: 实际启动及鉴权检查
        run: bash tools/smoke-image.sh ghcr.io/4o4e/personal-training:${{ github.ref_name }}
      - name: 检查采集器镜像入口
        run: docker run --rm ghcr.io/4o4e/personal-training-collector:${{ github.ref_name }} --help
      - name: 检查部署配置
        run: docker compose --file compose.yml config --quiet
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 推送已验收的后端及采集器镜像
        env:
          SERVER_TAGS: ${{ steps.meta.outputs.tags }}
          COLLECTOR_TAGS: ${{ steps.collector-meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do docker push "$tag"; done <<< "$SERVER_TAGS"
          while IFS= read -r tag; do docker push "$tag"; done <<< "$COLLECTOR_TAGS"
      - name: 匿名拉取验证
        run: |
          configuration="$(mktemp -d)"
          trap 'rm -rf "$configuration"' EXIT
          docker --config "$configuration" pull ghcr.io/4o4e/personal-training:${{ github.ref_name }}
          docker --config "$configuration" pull ghcr.io/4o4e/personal-training-collector:${{ github.ref_name }}
      - name: 发布已通过全部检查的正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: 记录发布地址
        run: |
          printf 'Release: https://github.com/%s/releases/tag/%s\n\n镜像：`ghcr.io/4o4e/personal-training:%s`、`ghcr.io/4o4e/personal-training-collector:%s` 及各自的 `latest`\n\n部署请先保留双端备份，再升级后端和采集器后覆盖安装同版 APK。' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
