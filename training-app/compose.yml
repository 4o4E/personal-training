services:
  training:
    image: ghcr.io/4o4e/personal-training:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TRAINING_DATA=/data
      - PORT=8080
      - TRAINING_TOKEN
    volumes:
      - training-data:/data
volumes:
  training-data:
